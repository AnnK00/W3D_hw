      function init_scene() {
        // Get the container element from the HTML
        const container = document.getElementById('scene-container');

        scene = new THREE.Scene();
        // Set camera aspect ratio based on the container's size
        camera = new THREE.PerspectiveCamera(70, container.clientWidth / container.clientHeight, 1, 10000);
        camera.position.x = 0;
        camera.position.y = 50;
        camera.position.z = 150;

        renderer = new THREE.WebGLRenderer();
        // Set renderer size to fill the container
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setClearColor(0xaaaaaa);

        // Append the renderer's canvas to the container DIV, not the body
        container.appendChild(renderer.domElement);
        let controls = new OrbitControls(camera, renderer.domElement);

        // Add resize listener to handle window resizing
        window.addEventListener('resize', () => {
          const container = document.getElementById('scene-container');
          if (container) {
            // Update camera aspect ratio
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            // Update renderer size
            renderer.setSize(container.clientWidth, container.clientHeight);
          }
        }, false);
      }

      // Make viewpoint functions global
      window.viewpoint_1 = function () {
        camera.position.x = 0;
        camera.position.y = 1200;
        camera.position.z = 0;
      }

      window.viewpoint_2 = function () {
        camera.position.x = 200;
        camera.position.y = 600;
        camera.position.z = 200;
      }

          // This function creates a flat Plane (Mesh) with text
          function createPaintingLabelPlane(textLines) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const fontSize = 42;
            context.font = `Bold ${fontSize}px Arial`;

            // Find the widest line of text
            let maxWidth = 0;
            textLines.forEach(line => {
              maxWidth = Math.max(maxWidth, context.measureText(line).width);
            });

            const lineHeight = fontSize * 1.2;
            const textHeight = lineHeight * textLines.length;
            const padding = 20;
            canvas.width = maxWidth + (padding * 2);
            canvas.height = textHeight + (padding * 2);
            context.fillStyle = 'rgba(30, 30, 30, 0.8)';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.font = `Bold ${fontSize}px Arial`;
            context.fillStyle = 'rgba(255, 255, 255, 1.0)';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            const centerX = canvas.width / 2;
            const startY = (canvas.height - (textHeight - lineHeight)) / 2;
            textLines.forEach((line, index) => {
              context.fillText(line, centerX, startY + (index * lineHeight) - (fontSize * 0.1));
            });

            const texture = new THREE.CanvasTexture(canvas);
            // Use MeshBasicMaterial (unlit) and set transparent
            const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
            const scale = 0.20;
            const planeWidth = canvas.width * scale;
            const planeHeight = (canvas.height * scale);
            const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
            const labelMesh = new THREE.Mesh(geometry, material);
            return { mesh: labelMesh, height: planeHeight };
          }

            const labelHeight = labelInfo.height;
            const paddingBelowPainting = 15;
            const labelYOffset = (paintingHeight / 2) + (labelHeight / 2) + paddingBelowPainting;
            
            // Start with the painting's exact position
            const labelPos = painting.position.clone();
            labelPos.y -= labelYOffset;

            // Position and Rotate the label
            const offset = 2;
            switch (info.wallType) {
              case 'x-plus':
                labelPos.x += offset;
                labelMesh.rotation.y = Math.PI / 2;
                break;
              case 'x-minus':
                labelPos.x -= offset;
                labelMesh.rotation.y = -Math.PI / 2;
                break;
              case 'z-plus':
                labelPos.z += offset;
                break;
              case 'z-minus':
                labelPos.z -= offset;
                labelMesh.rotation.y = Math.PI;
                break;
            }

            // Apply the final calculated position and add to scene
            labelMesh.position.copy(labelPos);
            scene.add(labelMesh);
          });
        }
